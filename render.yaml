services:
  - type: web
    name: folio-api
    runtime: python
    rootDir: folio-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # Pin Python so pydantic-core installs from a prebuilt wheel (3.14 has none yet).
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      # Set the rest in the Render dashboard (see SETUP.md):
      # DATABASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_JWT_SECRET,
      # SUPABASE_SERVICE_ROLE_KEY, CORS_ORIGINS, APP_URL, PUBLIC_PORTFOLIO_URL, API_URL
